<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Flow — Create Task</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/task-creation.css">
</head>
<body class="task-creation-page">

  <main class="task-creation">
    <form class="task-form card" novalidate>

      <h1 class="visually-hidden">Create Task — Sprint 4 Deliverables</h1>

      <!-- ================= Step indicator ================= -->
      <ol class="stepper" aria-label="Task creation progress">
        <li class="stepper__step stepper__step--complete">
          <span class="stepper__icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 6.5 9.5 17 4 11.5"/></svg>
          </span>
          <div class="stepper__text">
            <span class="stepper__label">Step 1</span>
            <span class="stepper__title">Sprint 4 Deliverables</span>
          </div>
        </li>
        <li class="stepper__separator" aria-hidden="true">
          <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
        </li>
        <li class="stepper__step stepper__step--active" aria-current="step">
          <span class="stepper__icon" aria-hidden="true">2</span>
          <div class="stepper__text">
            <span class="stepper__label">Active</span>
            <span class="stepper__title">Task Details</span>
          </div>
        </li>
      </ol>

      <!-- ================= Task name ================= -->
      <div class="form-group">
        <label for="task-name">Task Name</label>
        <input
          type="text"
          id="task-name"
          name="taskName"
          class="text-input"
          value="Implement multi-step workflow logic"
          required>
      </div>

      <!-- ================= Description ================= -->
      <div class="form-group">
        <label for="task-description">Description</label>
        <div class="rich-textarea">
          <textarea id="task-description" name="description" class="textarea-input" rows="3">Need to hook up Step 1 (Group Selection) to Step 2 (Task Details) so values carry forward seamlessly.</textarea>
          <div class="rich-textarea__toolbar">
            <button type="button" class="format-btn" data-format="bold" aria-label="Bold">
              <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M6 4h7a3.5 3.5 0 0 1 0 7H6zM6 11h8a3.5 3.5 0 0 1 0 7H6z"/></svg>
            </button>
            <button type="button" class="format-btn" data-format="italic" aria-label="Italic">
              <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M11 4h6M7 20h6M14 4 10 20"/></svg>
            </button>
            <button type="button" class="format-btn" data-format="strikethrough" aria-label="Strikethrough">
              <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M16 4.5H9.8a3.2 3.2 0 0 0-2.9 4.6"/><path d="M14 12a4 4 0 0 1 0 7.5H6"/><path d="M4 12h16"/></svg>
            </button>
            <button type="button" class="format-btn" data-format="code" aria-label="Code">
              <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>
            </button>
            <button type="button" class="checklist-toggle" id="checklist-toggle" aria-expanded="false" aria-controls="checklist-items">
              <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="m4 6 1.5 1.5L8 5M4 12l1.5 1.5L8 10M4 18l1.5 1.5L8 17"/><path d="M11 6h9M11 12h9M11 18h9"/></svg>
              Checklist
            </button>
          </div>
        </div>

        <ul class="checklist" id="checklist-items" hidden>
          <!-- Checklist items are added here by js/task-creation.js -->
        </ul>
      </div>

      <!-- ================= Priority ================= -->
      <div class="form-group">
        <span class="form-label" id="priority-label">Priority</span>
        <div class="priority-select" role="group" aria-labelledby="priority-label">
          <span class="priority-select__value">Normal Priority</span>
          <button type="button" class="priority-select__btn" id="priority-menu-btn" aria-label="Choose priority level" aria-haspopup="listbox">
            <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button type="button" class="priority-select__btn" aria-label="Escalate priority">
            <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </div>

      <!-- ================= Due date & time ================= -->
      <div class="form-row">
        <label class="checkbox-field">
          <input type="checkbox" id="due-date-toggle" name="dueDateEnabled" checked>
          <span class="checkbox-visual" aria-hidden="true"></span>
          Set due date &amp; time
        </label>
        <div class="datetime-controls">
          <button type="button" class="picker-btn" id="due-date-btn">
            <svg class="icon icon--sm" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>
            Aug 20, 2026
          </button>
          <button type="button" class="picker-btn" id="due-time-btn">
            <svg class="icon icon--sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            2:00 PM
          </button>
        </div>
      </div>

      <!-- ================= Urgent ================= -->
      <div class="form-row">
        <label class="checkbox-field">
          <input type="checkbox" id="urgent-toggle" name="urgent">
          <span class="checkbox-visual" aria-hidden="true"></span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.5h5.5L11 21l8-11h-5.5z"/></svg>
          Urgent
        </label>
        <span class="field-hint">Flag as critical escalation</span>
      </div>

      <!-- ================= Assignees ================= -->
      <div class="form-group">
        <label for="assignee-input">Assign To</label>
        <div class="assignee-field" id="assignee-field">
          <span class="assignee-chip" data-assignee-id="sarah-k">
            <span class="avatar avatar--xs" aria-hidden="true">SK</span>
            Sarah K.
            <button type="button" class="assignee-chip__remove" aria-label="Remove Sarah K. as assignee">
              <svg class="icon" viewBox="0 0 24 24" style="width:10px;height:10px;stroke-width:2.6;"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </span>
          <input type="text" id="assignee-input" class="assignee-field__input" placeholder="Add people...">
        </div>
      </div>

      <!-- ================= Actions ================= -->
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" id="back-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          Back
        </button>
        <button type="submit" class="btn btn--primary">
          Create Task
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 6.5 9.5 17 4 11.5"/></svg>
        </button>
      </div>

    </form>
  </main>

  <script src="js/task-creation.js"></script>
</body>
</html>
